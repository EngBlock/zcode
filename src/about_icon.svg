<!-- zcode's app icon, as scripts/bundle/make_icon.swift draws it (its
     coordinates with y flipped), for the About window. -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="slate" gradientUnits="userSpaceOnUse" x1="512" y1="100" x2="512" y2="924">
      <stop offset="0" stop-color="#333d52"/>
      <stop offset="1" stop-color="#12171f"/>
    </linearGradient>
    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="300" y1="284" x2="740" y2="734">
      <stop offset="0" stop-color="#8cdbff"/>
      <stop offset="1" stop-color="#4585ff"/>
    </linearGradient>
    <linearGradient id="highlight" gradientUnits="userSpaceOnUse" x1="512" y1="100" x2="512" y2="164">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="square-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="z-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <clipPath id="square">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="#1c212e" filter="url(#square-shadow)"/>
  <g clip-path="url(#square)">
    <rect x="100" y="100" width="824" height="824" fill="url(#slate)"/>
    <path d="M292 300H732V396L442 628H732V724H292V628L582 396H292Z" fill="url(#blue)" filter="url(#z-shadow)"/>
    <rect x="100" y="100" width="824" height="64" fill="url(#highlight)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#fff" stroke-opacity="0.10" stroke-width="4"/>
</svg>
