[package]
name = "zcode"
version = "0.1.4"
edition = "2024"
description = "A fast, Zed-inspired editor for the Apple ecosystem"
license = "MIT"

[workspace]
members = ["crates/zcode-editor", "crates/zcode-emmet"]
default-members = [".", "crates/zcode-editor", "crates/zcode-emmet"]
exclude = ["vendor/gpui-base", "vendor/gpui-component", "vendor/gpui-pre-macos"]

[dependencies]
zcode-editor = { path = "crates/zcode-editor" }
zcode-emmet = { path = "crates/zcode-emmet" }
# The integrated terminal's VT parser, grid and PTY (Apache-2.0).
alacritty_terminal = { version = "0.26", default-features = false }
# The Agent Client Protocol's message types (Apache-2.0); zcode has its own
# transport (`src/acp/connection.rs`).
agent-client-protocol-schema = "=1.5.0"
gpui-kit = { version = "=0.7.3", features = [
    "tree-sitter",
    "tree-sitter-swift",
    "tree-sitter-c",
    "tree-sitter-cpp",
    "tree-sitter-yaml",
    "tree-sitter-markdown",
    "tree-sitter-bash",
    "tree-sitter-toml",
    "tree-sitter-html",
    "tree-sitter-rust",
    "tree-sitter-javascript",
    "tree-sitter-python",
    # Web apps (Vite's languages).
    "tree-sitter-css",
    "tree-sitter-typescript",
    "tree-sitter-tsx",
    "tree-sitter-jsdoc",
    "tree-sitter-svelte",
    "tree-sitter-astro",
] }
anyhow = "1"
futures = "0.3"
# Edit predictions' never-sent files (`edit_predictions.disabled_globs`);
# already here through `ignore`.
globset = "0.4"
ignore = "0.4"
# Asset catalog thumbnails: raster images (MIT OR Apache-2.0) and SVGs
# (Apache-2.0 OR MIT), both already built for GPUI's images.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "tiff", "bmp", "webp", "ico"] }
resvg = { version = "0.46", default-features = false }
libc = "0.2"
log = "0.4"
lsp-types = { version = "0.97", features = ["proposed"] }
# FSEvents for files changed on disk (src/fs_watch.rs; CC0-1.0, already
# built for gpui-component).
notify = "8.2"
nucleo-matcher = "0.3"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSWindow", "NSResponder", "NSGraphics", "NSView"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSError"] }
# zcode ▸ Open at Login: SMAppService (Zlib OR Apache-2.0 OR MIT, like objc2).
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
# Asset catalog thumbnails of PDFs, drawn by Core Graphics (already built
# for GPUI and AppKit).
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std",
    "CGBitmapContext",
    "CGColorSpace",
    "CGContext",
    "CGDataProvider",
    "CGImage",
    "CGPDFDocument",
    "CGPDFPage",
] }
parking_lot = "0.12"
# A window's AppKit view, for its window number (screenshots).
raw-window-handle = "0.6"
regex = "1"
# Markdown previews: the lines of the blocks gpui-base's TextView renders
# (markdown-rs, MIT), and the images `data:` URLs carry (MIT OR
# Apache-2.0); both already built for it.
markdown = "1"
data-url = "0.3"
# Reading `xctrace export`'s XML for Profile's summary (MIT OR Apache-2.0;
# already built for gpui's SVGs).
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
similar = "2"
smol = "2"
tree-sitter = "0.26"
tree-sitter-swift = "0.7"
# The Claude API for edit predictions and the update feed: blocking HTTP on a
# thread of its own, TLS through macOS (Security.framework) and its trust
# store. `native-tls`, not `native-tls-no-default`: ureq panics on an https
# URL with TlsProvider::NativeTls unless the full feature is on.
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 16

[profile.dev.package."*"]
opt-level = 2


# gpui-component 0.7.3 with one startup fix: its theme init lists every
# installed font (~35 ms of cold launch on macOS) only to check a few names.
# See vendor/gpui-component/ZCODE-PATCH.md.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
gpui-component = { path = "vendor/gpui-component" }
# gpui-pre-macos 0.3.9 (GPUI's macOS backend) with the display link paused
# while a window has nothing to draw. See vendor/gpui-pre-macos/ZCODE-PATCH.md.
gpui-pre-macos = { path = "vendor/gpui-pre-macos" }
